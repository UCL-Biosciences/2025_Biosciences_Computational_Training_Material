name: Sync submodules

on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday 8am UTC
  workflow_dispatch:        # allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout training repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest upstream commits
        run: git submodule update --remote --merge

      - name: Create Pull Request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-sync submodule pointers"
          title: "Submodule updates available"
          body: |
            One or more session submodules have new commits upstream.
            This PR updates the pointer(s) in this repo to match.

            Review the linked commits in each submodule before merging.
          branch: sync-submodules
          delete-branch: true
